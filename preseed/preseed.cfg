### Debian 12 unattended install template for crazy-vlan-accessor.
### Rendered by scripts/build-usb-image.sh.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select de
d-i console-setup/ask_detect boolean false

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string @@HOSTNAME@@
d-i netcfg/get_domain string local

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Crazy VLAN Administrator
d-i passwd/username string @@ADMIN_USER@@
d-i passwd/user-password-crypted password @@ADMIN_PASSWORD_HASH@@

d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl ca-certificates
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note

d-i preseed/late_command string \
    mkdir -p /target/usr/local/lib/crazy-vlan-accessor /target/usr/local/etc/crazy-vlan-accessor; \
    cp /cdrom/crazy-vlan-accessor/setup-host.sh /target/usr/local/lib/crazy-vlan-accessor/setup-host.sh; \
    cp /cdrom/preseed/config.env /target/usr/local/etc/crazy-vlan-accessor/config.env; \
    cp /cdrom/preseed/first-boot.service /target/etc/systemd/system/crazy-vlan-first-boot.service; \
    cp /cdrom/preseed/first-boot.sh /target/usr/local/lib/crazy-vlan-accessor/first-boot.sh; \
    chmod 0755 /target/usr/local/lib/crazy-vlan-accessor/setup-host.sh /target/usr/local/lib/crazy-vlan-accessor/first-boot.sh; \
    in-target systemctl enable crazy-vlan-first-boot.service
